<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ESP32 Firebase Chat</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f3f6;
    }

    .container {
        width: 95%;
        max-width: 700px;
        margin: 40px auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .status {
        background: white;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 15px;
        text-align: center;
    }

    .chat {
        height: 500px;
        background: white;
        border-radius: 12px;
        padding: 15px;
        overflow-y: auto;
        border: 1px solid #ddd;

        display: flex;
        flex-direction: column;
    }

    .message {
        max-width: 80%;
        margin: 8px 0;
        padding: 10px 14px;
        border-radius: 12px;
        word-wrap: break-word;
        overflow-wrap: anywhere;
    }

    /* ESP32 messages - LEFT */
    .esp32 {
        background: #e7f0ff;
        margin-right: auto;
        margin-left: 0;
    }

    /* Web messages - RIGHT */
    .web {
        background: #e7ffe7;
        margin-left: auto;
        margin-right: 0;
    }

    .sender {
        font-weight: bold;
        margin-bottom: 4px;
    }

    .text {
        white-space: pre-wrap;
    }

    .time {
        font-size: 11px;
        color: #777;
        margin-top: 5px;
    }

    .input-area {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    input {
        flex: 1;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid #bbb;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #555;
    }

    button {
        padding: 14px 22px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    .send-button {
        background: #222;
        color: white;
    }

    .send-button:hover {
        background: #444;
    }

    .send-button:disabled {
        background: #999;
        cursor: not-allowed;
    }

    .empty {
        text-align: center;
        color: #777;
        margin: auto;
    }

</style>
```

</head>

<body>

<div class="container">

```
<h1>ESP32 Firebase Chat</h1>

<div id="status" class="status">
    Connecting...
</div>

<div id="chat" class="chat">

    <p class="empty">
        Loading messages...
    </p>

</div>

<div class="input-area">

    <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
    >

    <button
        id="sendButton"
        class="send-button"
        onclick="sendMessage()"
    >
        Send
    </button>

</div>
```

</div>

<script type="module">

    // =========================================
    // FIREBASE IMPORTS
    // =========================================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        onChildAdded,
        onValue,
        query,
        orderByChild,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    // =========================================
    // FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {
  apiKey: "AIzaSyDZ54WDwtLcq-hD8T_FNVdK7dbuUhHCV-Q",
  authDomain: "kioski01.firebaseapp.com",
  databaseURL: "https://kioski01-default-rtdb.firebaseio.com",
  projectId: "kioski01",
  storageBucket: "kioski01.firebasestorage.app",
  messagingSenderId: "493198813190",
  appId: "1:493198813190:web:2700b5415825efb948fb87"

    };


    // =========================================
    // INITIALIZE FIREBASE
    // =========================================

    const app =
        initializeApp(firebaseConfig);

    const database =
        getDatabase(app);


    // =========================================
    // DATABASE REFERENCE
    // =========================================

    const messagesRef =
        ref(database, "messages");


    // =========================================
    // ORDER MESSAGES BY TIMESTAMP
    // =========================================

    const orderedMessages =
        query(
            messagesRef,
            orderByChild("timestamp")
        );


    // =========================================
    // HTML ELEMENTS
    // =========================================

    const chat =
        document.getElementById("chat");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const status =
        document.getElementById("status");


    // =========================================
    // TRACK MESSAGE COUNT
    // =========================================

    let messageCount = 0;


    // =========================================
    // REAL-TIME MESSAGE LISTENER
    // =========================================

    onChildAdded(
        orderedMessages,
        (snapshot) => {

            const message =
                snapshot.val();

            if (!message) {
                return;
            }


            // Remove "Loading messages..."
            // or "No messages yet."
            if (messageCount === 0) {

                chat.innerHTML = "";

            }


            messageCount++;


            // =================================
            // MESSAGE CONTAINER
            // =================================

            const div =
                document.createElement("div");


            // ESP32 = left
            // Everything else = right

            if (
                message.sender &&
                message.sender.toUpperCase() === "ESP32"
            ) {

                div.className =
                    "message esp32";

            } else {

                div.className =
                    "message web";

            }


            // =================================
            // SENDER
            // =================================

            const sender =
                document.createElement("div");

            sender.className =
                "sender";

            sender.textContent =
                message.sender || "Unknown";


            // =================================
            // MESSAGE TEXT
            // =================================

            const text =
                document.createElement("div");

            text.className =
                "text";

            text.textContent =
                message.text || "";


            // =================================
            // TIMESTAMP
            // =================================

            const time =
                document.createElement("div");

            time.className =
                "time";


            if (
                message.timestamp &&
                typeof message.timestamp === "number"
            ) {

                time.textContent =
                    new Date(
                        message.timestamp
                    ).toLocaleString();

            } else {

                time.textContent =
                    "Time unavailable";

            }


            // =================================
            // BUILD MESSAGE
            // =================================

            div.appendChild(sender);

            div.appendChild(text);

            div.appendChild(time);

            chat.appendChild(div);


            // =================================
            // SCROLL TO NEWEST MESSAGE
            // =================================

            chat.scrollTop =
                chat.scrollHeight;

        },

        (error) => {

            console.error(
                "Firebase message listener error:",
                error
            );

            status.textContent =
                "🔴 Failed to load messages";

        }
    );


    // =========================================
    // SEND MESSAGE WEB → FIREBASE
    // =========================================

    window.sendMessage =
        async function () {

            const text =
                input.value.trim();


            // Don't send empty messages
            if (!text) {

                return;

            }


            // Prevent double-click sending
            sendButton.disabled =
                true;


            try {

                await push(
                    messagesRef,
                    {

                        sender: "WEB",

                        text: text,

                        // Firebase server timestamp
                        timestamp:
                            serverTimestamp()

                    }
                );


                // Clear input
                input.value = "";

                // Put cursor back
                input.focus();


            } catch (error) {

                console.error(
                    "Send error:",
                    error
                );

                alert(
                    "Failed to send message."
                );

            } finally {

                sendButton.disabled =
                    false;

            }

        };


    // =========================================
    // ENTER KEY
    // =========================================

    input.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // =========================================
    // FIREBASE CONNECTION STATUS
    // =========================================

    const connectedRef =
        ref(
            database,
            ".info/connected"
        );


    onValue(
        connectedRef,
        (snapshot) => {

            if (
                snapshot.val() === true
            ) {

                status.textContent =
                    "🟢 Connected to Firebase";

            } else {

                status.textContent =
                    "🔴 Disconnected from Firebase";

            }

        }
    );

</script>

</body>

</html>
